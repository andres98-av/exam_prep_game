<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicQuest — U.S. Citizenship Test Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2F6FED; --blue-d:#1E4FB8;
  --red:#E5484D; --red-d:#B5303A; --red-l:#FFE3E3;
  --green:#3DBE5C; --green-d:#2A9545; --green-l:#DDF7E3;
  --gold:#FFC23D; --gold-d:#E09A00;
  --ink:#24324A; --muted:#7A879C; --line:#E3E8F0; --bg:#FFFFFF; --soft:#F4F7FB;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700}
button{font-family:inherit;cursor:pointer}
.app{max-width:620px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;color:var(--blue)}
.brand svg{width:34px;height:34px}
.stats{display:flex;gap:14px;font-weight:900;font-size:16px}
.stat{display:flex;align-items:center;gap:4px}
.stat.fire{color:#FF8A00}.stat.gem{color:var(--blue)}.stat.goal{color:var(--green-d)}
.stat svg{width:22px;height:22px}
main{flex:1;padding:16px 16px 100px}
/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
.nav button{background:none;border:2px solid transparent;border-radius:14px;padding:6px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--muted)}
.nav button svg{width:28px;height:28px}
.nav button.on{border-color:#BFD3FB;background:#EEF4FF;color:var(--blue)}
/* chunky buttons */
.btn{border:none;border-radius:16px;padding:14px 18px;font-size:16px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);transition:transform .05s, box-shadow .05s;width:100%}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--blue-d)}
.btn:disabled{background:#E5E9F0;color:#A7B1C2;box-shadow:0 4px 0 #CDD4DF;cursor:default}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.gold{background:var(--gold);box-shadow:0 4px 0 var(--gold-d);color:#5A3B00}
.btn.ghost{background:#fff;color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:10px 14px;font-size:13px;width:auto}
/* unit banner & path */
.unit{border-radius:18px;padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit h3{margin:0;font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:1px;font-weight:900}
.unit h2{margin:2px 0 0;font-size:20px;font-weight:900}
.unit .sub{font-size:13px;opacity:.9;margin-top:4px}
.unit button{background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;border-radius:12px;padding:8px 12px;font-weight:900;font-size:13px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:12px 0 6px}
.node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
.node{width:74px;height:68px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;position:relative}
.node svg{width:34px;height:34px}
.node.locked{background:#E5E9F0;box-shadow:0 7px 0 #C8D0DC;color:#AEB8C7}
.node.open{color:#fff}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d);color:#fff}
.node:active:not(.locked){transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.2)!important}
.node-label{font-size:12px;color:var(--muted);margin-top:12px;font-weight:800;text-align:center;max-width:140px}
.start-tip{position:absolute;top:-44px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:900;font-size:14px;color:var(--blue);animation:bob 1.4s ease-in-out infinite;white-space:nowrap;z-index:2}
.start-tip:after{content:"";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ring{position:absolute;inset:-9px;border-radius:50%;border:5px solid #D9E3F4}
/* cards */
.card{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;background:#fff}
.card h4{margin:0 0 6px;font-size:17px;font-weight:900}
.card p{margin:0;color:var(--muted);font-size:14px;font-weight:700;line-height:1.4}
.row{display:flex;gap:12px;align-items:center}
.icon-tile{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.icon-tile svg{width:30px;height:30px}
h1.page{font-size:24px;font-weight:900;margin:6px 0 14px}
/* lesson */
.lesson{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column}
.lesson-inner{max-width:620px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;padding:14px 16px 0;overflow:auto}
.lhead{display:flex;align-items:center;gap:14px}
.x{background:none;border:none;color:#AEB8C7;padding:4px}
.x svg{width:28px;height:28px}
.pbar{flex:1;height:16px;background:#E5E9F0;border-radius:99px;overflow:hidden}
.pbar>div{height:100%;background:var(--green);border-radius:99px;transition:width .35s;position:relative}
.pbar>div:after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;background:rgba(255,255,255,.35);border-radius:9px}
.hearts{display:flex;align-items:center;gap:4px;color:var(--red);font-weight:900;font-size:17px}
.hearts svg{width:24px;height:24px}
.combo{text-align:center;color:#FF8A00;font-weight:900;font-size:14px;height:18px;margin-top:10px}
.qtype{font-size:14px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:8px 0 6px;display:flex;align-items:center;gap:8px}
.qtype .star{color:var(--gold-d)}
.qbox{display:flex;gap:12px;align-items:flex-start;margin:6px 0 20px}
.qbox .mascot{width:86px;flex-shrink:0}
.bubble{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:19px;font-weight:800;line-height:1.35;flex:1}
.bubble:before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.speak{background:none;border:none;color:var(--blue);padding:0 6px 0 0;vertical-align:-5px}
.speak svg{width:24px;height:24px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;background:#fff;padding:14px 14px;font-size:16px;font-weight:800;color:var(--ink);display:flex;gap:12px;align-items:center;line-height:1.3}
.opt .k{flex-shrink:0;width:28px;height:28px;border:2px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.opt.sel{border-color:#8DB2F8;background:#EEF4FF;color:var(--blue-d)}
.opt.sel .k{border-color:#8DB2F8;color:var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.wrong{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.opt:disabled{cursor:default}
textarea.type{width:100%;min-height:110px;border:2px solid var(--line);border-radius:14px;background:var(--soft);padding:14px;font:inherit;font-size:18px;resize:none;color:var(--ink)}
textarea.type:focus{outline:none;border-color:#8DB2F8;background:#fff}
.lfoot{border-top:2px solid var(--line);padding:16px;margin-top:auto}
.lfoot .inner{max-width:620px;margin:0 auto;display:flex;gap:12px;align-items:center}
.lfoot.ok{background:var(--green-l);border-color:transparent}
.lfoot.bad{background:var(--red-l);border-color:transparent}
.fb{flex:1}
.fb .t{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px}
.lfoot.ok .t{color:var(--green-d)}.lfoot.bad .t{color:var(--red-d)}
.fb .ans{font-size:15px;margin-top:4px;font-weight:800}
.lfoot.ok .ans{color:var(--green-d)}.lfoot.bad .ans{color:var(--red-d)}
.fb details{margin-top:6px;font-size:13px}
.fb summary{cursor:pointer;opacity:.8}
.fb ul{margin:4px 0 0;padding-left:18px}
.fbbtn{width:160px;flex-shrink:0}
@media (max-width:520px){.lfoot .inner{flex-direction:column;align-items:stretch}.fbbtn{width:100%}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .3s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* results */
.center{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:20px 0}
.center h2{font-size:28px;font-weight:900;margin:14px 0 6px}
.center .lead{color:var(--muted);font-size:16px;margin:0 0 22px}
.tiles{display:flex;gap:12px;width:100%;justify-content:center;flex-wrap:wrap}
.tile{border:2px solid;border-radius:16px;overflow:hidden;min-width:104px;flex:1;max-width:160px}
.tile .h{color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;padding:5px;letter-spacing:.6px}
.tile .v{font-size:22px;font-weight:900;padding:12px 6px;display:flex;align-items:center;justify-content:center;gap:6px;background:#fff}
/* study */
.search{width:100%;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:var(--soft);margin-bottom:10px}
.search:focus{outline:none;border-color:#8DB2F8;background:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.chip{flex-shrink:0;border:2px solid var(--line);border-radius:99px;padding:6px 12px;background:#fff;font-weight:800;font-size:13px;color:var(--muted)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qitem{border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.qitem .num{font-size:12px;color:var(--muted);font-weight:900;display:flex;gap:8px;align-items:center}
.qitem .q{font-size:16px;font-weight:900;margin:4px 0 8px}
.qitem ul{margin:0;padding-left:20px;color:#3C4B66;font-size:15px;font-weight:700;line-height:1.5}
.badge{font-size:11px;font-weight:900;border-radius:6px;padding:2px 6px}
.badge.star{background:#FFF2CC;color:#8A5A00}
.badge.cur{background:#E6EEFF;color:var(--blue-d)}
.badge.loc{background:#EDE7FF;color:#5B3CC4}
.dots{display:inline-flex;gap:3px;margin-left:auto}
.dots i{width:8px;height:8px;border-radius:50%;background:#E5E9F0;display:block}
.dots i.f{background:var(--green)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
/* flashcard */
.flash{perspective:1000px;width:100%;height:320px;margin:10px 0 18px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flash.flip .in{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;font-size:21px;font-weight:900;background:#fff;overflow:auto}
.flash .back{transform:rotateY(180deg);background:#F2F7FF;font-size:17px}
.flash .back ul{text-align:left;margin:0;padding-left:20px;line-height:1.5}
.flash small{font-size:12px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
/* profile */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.sbox{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.sbox svg{width:28px;height:28px;flex-shrink:0}
.sbox b{display:block;font-size:20px;font-weight:900}
.sbox span{font-size:12px;color:var(--muted);font-weight:800}
label.f{display:block;font-size:13px;font-weight:900;color:var(--muted);margin:10px 0 4px}
input.f{width:100%;border:2px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px;background:var(--soft)}
input.f:focus{outline:none;border-color:#8DB2F8;background:#fff}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px solid var(--soft)}
.sw{width:52px;height:30px;border-radius:99px;background:#D5DCE7;border:none;position:relative;flex-shrink:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--green)}.sw.on:after{left:25px}
.goalbar{height:12px;background:#E5E9F0;border-radius:99px;overflow:hidden;margin-top:8px}
.goalbar>div{height:100%;background:var(--gold)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(20,30,50,.45);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:620px;border-radius:22px 22px 0 0;padding:22px 18px 26px;text-align:center}
.modal h3{font-size:20px;font-weight:900;margin:8px 0 6px}
.modal p{color:var(--muted);margin:0 0 18px}
.modal .stack{display:flex;flex-direction:column;gap:12px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
a{color:var(--blue)}
.kbd{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<canvas id="confetti"></canvas>
<script>
/* ===================== DATA: USCIS 2025 civics test (128 questions, form M-1778) =====================
   f flags: s = 65/20 special consideration question, t = can be typed, c = changes with elections,
   L = depends on where you live, k = how many answers needed */
const Q = [
{n:1,q:"What is the form of government of the United States?",a:["Republic","Constitution-based federal republic","Representative democracy"],d:["Constitutional monarchy","Dictatorship","Absolute monarchy"],t:1},
{n:2,q:"What is the supreme law of the land?",a:["(U.S.) Constitution"],d:["Declaration of Independence","Bill of Rights","Articles of Confederation"],s:1,t:1},
{n:3,q:"Name one thing the U.S. Constitution does.",a:["Forms the government","Defines powers of government","Defines the parts of government","Protects the rights of the people"],d:["Declares independence from Britain","Sets the prices of goods","Creates a state religion"]},
{n:4,q:"The U.S. Constitution starts with the words “We the People.” What does “We the People” mean?",a:["Self-government","Popular sovereignty","Consent of the governed","People should govern themselves","(Example of) social contract"],d:["The President rules alone","Only landowners govern","Government by the military"]},
{n:5,q:"How are changes made to the U.S. Constitution?",a:["Amendments","The amendment process"],d:["Presidential orders","Supreme Court votes","State referendums"],t:1},
{n:6,q:"What does the Bill of Rights protect?",a:["(The basic) rights of Americans","(The basic) rights of people living in the United States"],d:["The powers of the President","The rights of the states only","The federal budget"]},
{n:7,q:"How many amendments does the U.S. Constitution have?",a:["Twenty-seven (27)"],d:["Ten (10)","Twenty-five (25)","Thirty-three (33)"],s:1,t:1},
{n:8,q:"Why is the Declaration of Independence important?",a:["It says America is free from British control","It says all people are created equal","It identifies inherent rights","It identifies individual freedoms"],d:["It created the U.S. Constitution","It ended the Civil War","It set up the Supreme Court"]},
{n:9,q:"What founding document said the American colonies were free from Britain?",a:["Declaration of Independence"],d:["U.S. Constitution","Bill of Rights","Federalist Papers"],t:1},
{n:10,q:"Name two important ideas from the Declaration of Independence and the U.S. Constitution.",a:["Equality","Liberty","Social contract","Natural rights","Limited government","Self-government"],d:["Monarchy","Unlimited government","Divine right of kings"],k:2},
{n:11,q:"The words “Life, Liberty, and the pursuit of Happiness” are in what founding document?",a:["Declaration of Independence"],d:["U.S. Constitution","Bill of Rights","Emancipation Proclamation"],t:1},
{n:12,q:"What is the economic system of the United States?",a:["Capitalism","Free market economy"],d:["Socialism","Communism","Feudalism"],s:1,t:1},
{n:13,q:"What is the rule of law?",a:["Everyone must follow the law","Leaders must obey the law","Government must obey the law","No one is above the law"],d:["The President is above the law","Laws apply only to citizens","Judges can ignore the law"]},
{n:14,q:"Many documents influenced the U.S. Constitution. Name one.",a:["Declaration of Independence","Articles of Confederation","Federalist Papers","Anti-Federalist Papers","Virginia Declaration of Rights","Fundamental Orders of Connecticut","Mayflower Compact","Iroquois Great Law of Peace"],d:["Emancipation Proclamation","Monroe Doctrine","Gettysburg Address"]},
{n:15,q:"There are three branches of government. Why?",a:["So one part does not become too powerful","Checks and balances","Separation of powers"],d:["So the states can vote twice","To make laws faster","So the President can rule alone"]},
{n:16,q:"Name the three branches of government.",a:["Legislative, executive, and judicial","Congress, president, and the courts"],d:["Federal, state, and local","Senate, House, and Cabinet","Army, Navy, and Air Force"]},
{n:17,q:"The President of the United States is in charge of which branch of government?",a:["Executive branch"],d:["Legislative branch","Judicial branch","State branch"],t:1},
{n:18,q:"What part of the federal government writes laws?",a:["(U.S.) Congress","(U.S. or national) legislature","Legislative branch"],d:["The President","The Supreme Court","The Cabinet"],t:1},
{n:19,q:"What are the two parts of the U.S. Congress?",a:["Senate and House (of Representatives)"],d:["Senate and Supreme Court","House and Cabinet","Senate and Electoral College"]},
{n:20,q:"Name one power of the U.S. Congress.",a:["Writes laws","Declares war","Makes the federal budget"],d:["Vetoes bills","Appoints federal judges","Commands the military"],s:1},
{n:21,q:"How many U.S. senators are there?",a:["One hundred (100)"],d:["Fifty (50)","Four hundred thirty-five (435)","Two hundred (200)"],t:1},
{n:22,q:"How long is a term for a U.S. senator?",a:["Six (6) years"],d:["Two (2) years","Four (4) years","Eight (8) years"],t:1},
{n:23,q:"Who is one of your state’s U.S. senators now?",a:["Answers will vary. (D.C. and U.S. territory residents: D.C. or the territory has no U.S. senators.)"],L:"sen"},
{n:24,q:"How many voting members are in the House of Representatives?",a:["Four hundred thirty-five (435)"],d:["One hundred (100)","Five hundred thirty-eight (538)","Four hundred fifty (450)"],t:1},
{n:25,q:"How long is a term for a member of the House of Representatives?",a:["Two (2) years"],d:["Four (4) years","Six (6) years","One (1) year"],t:1},
{n:26,q:"Why do U.S. representatives serve shorter terms than U.S. senators?",a:["To more closely follow public opinion"],d:["Because they have less work","Because the Senate chooses them","To save money on elections"]},
{n:27,q:"How many senators does each state have?",a:["Two (2)"],d:["One (1)","Three (3)","It depends on population"],t:1},
{n:28,q:"Why does each state have two senators?",a:["Equal representation (for small states)","The Great Compromise (Connecticut Compromise)"],d:["Because big states asked for it","To match the number of parties","Because of the Bill of Rights"]},
{n:29,q:"Name your U.S. representative.",a:["Answers will vary. (Territory residents may give the name of their Delegate or Resident Commissioner, or say the territory has no voting representatives in Congress.)"],L:"rep"},
{n:30,q:"What is the name of the Speaker of the House of Representatives now?",a:["Mike Johnson","Johnson"],d:["Chuck Schumer","Nancy Pelosi","John Thune"],s:1,t:1,c:1},
{n:31,q:"Who does a U.S. senator represent?",a:["Citizens of their state","People of their state"],d:["Only citizens of their district","The President","Only members of their party"]},
{n:32,q:"Who elects U.S. senators?",a:["Citizens from their state"],d:["The House of Representatives","The President","State governors"]},
{n:33,q:"Who does a member of the House of Representatives represent?",a:["Citizens in their (congressional) district","People from their (congressional) district"],d:["All citizens of the state","Only their political party","The whole country"]},
{n:34,q:"Who elects members of the House of Representatives?",a:["Citizens from their (congressional) district"],d:["The Senate","The state governor","The Electoral College"]},
{n:35,q:"Some states have more representatives than other states. Why?",a:["(Because of) the state’s population","(Because) they have more people","(Because) some states have more people"],d:["Because they are older states","Because they have more land","Because they pay more taxes"]},
{n:36,q:"The President of the United States is elected for how many years?",a:["Four (4) years"],d:["Two (2) years","Six (6) years","Eight (8) years"],s:1,t:1},
{n:37,q:"The President of the United States can serve only two terms. Why?",a:["(Because of) the 22nd Amendment","To keep the president from becoming too powerful"],d:["Because of the 19th Amendment","Because of the Bill of Rights","Because the Senate votes on it"]},

// ---- fuzzy typed-answer matching ----
function norm(s){return s.toLowerCase().replace(/[’']/g,"").replace(/&/g," and ").replace(/\bu\.?\s?s\.?\b/g," us ").replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an|of|us|united states|because|for|with|its|it)\b/g," ").replace(/\s+/g," ").trim()}
function variants(ans){const v=new Set();
  v.add(norm(ans.replace(/[()\[\]]/g," ")));
  v.add(norm(ans.replace(/\([^)]*\)/g," ")));
  const num=ans.match(/\((\d+)\)/); if(num){ v.add(num[1]); v.add(norm(ans.replace(/^[^(]*\((\d+)\)/,"$1"))); }
  ans.split(/[,/]| or /).forEach(p=>{const n=norm(p.replace(/\([^)]*\)/g," "));if(n.length>3&&ans.includes("/"))v.add(n)});
  v.delete(""); return [...v];}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function matches(input,answers){const x=norm(input); if(!x) return false;
  const dx=(x.match(/\d+/g)||[]).join(",");
  for(const a of answers){for(const v of variants(a)){
    if(x===v) return true;
    const dv=(v.match(/\d+/g)||[]).join(","); if((dx||dv)&&dx!==dv) continue;
    if(v.length>=4 && lev(x,v)<=Math.max(1,Math.floor(v.length*0.2))) return true;
    if(v.length>=5 && (" "+x+" ").includes(" "+v+" ")) return true;
  }} return false;}

let AC=null;
function tone(seq){ if(!S.set.sound) return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); let t=AC.currentTime;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);t+=d*.8;}); }catch(e){} }
const SND={ok:()=>tone([[660,.12],[880,.18]]),bad:()=>tone([[220,.18,"square"],[180,.22,"square"]]),win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]]),tap:()=>tone([[500,.05]])};
function speak(text){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.95;s.speak(u);}catch(e){}}

/* ===================== QUIZ ENGINE ===================== */
let L=null; // current session
function buildItem(q,forceMC){
  if(q.L){ return localReady(q)?{q,mode:"type"}:{q,mode:"info"}; }
  const canType = q.t && !forceMC && (S.m[q.n]||0)>=1 && Math.random()<0.5;
  if(canType) return {q,mode:"type"};
  const k=q.k||1, real=q.a.filter(a=>!a.startsWith("["));
  let correct, opts;
  if(k===1){ correct=sample(real,1)[0]; opts=[correct,...sample(q.d,3)]; }
  else{
    correct=sample(real,k).join(" • ");
    const ds=sample(q.d,3); opts=[correct, ...ds.map(d=>shuffle([...sample(real,k-1),d]).join(" • "))];
  }
  return {q,mode:"mc",correct,opts:shuffle(opts)};
}
function startSession(cfg){
  // cfg: {title, qs:[nums], kind:"lesson"|"review"|"practice"|"mock"|"six"|"oral", node, hearts, pass, stopWrong, max}
  const items = cfg.qs.map(n=>QBY[n]).filter(q=>!(cfg.kind!=="lesson"&&cfg.kind!=="review"&&q.L&&!localReady(q))).map(q=>buildItem(q,cfg.kind==="mock"||cfg.kind==="six"));
  L=Object.assign({queue:items,total:items.length,doneN:0,right:0,wrongN:0,mistakes:0,hearts:cfg.hearts??5,combo:0,bestCombo:0,start:Date.now(),answered:[],firstTry:new Set(),missed:new Set()},cfg);
  showItem();
}
function startLesson(node){
  if(node.type==="review") startSession({title:"Unit review",kind:"review",node,qs:sample(node.qs.filter(n=>!QBY[n].L||localReady(QBY[n])),Math.min(10,node.qs.length))});
  else startSession({title:"Lesson",kind:"lesson",node,qs:shuffle(node.qs)});
}
function startPractice(type){
  const pool = type==="wrong" ? Object.keys(S.wrong).map(Number) : Q.map(q=>q.n);
  startSession({title:type==="wrong"?"Fix mistakes":"Quick 10",kind:"practice",sub:type,qs:sample(pool,Math.min(10,pool.length))});
}
function startMock(type){
  if(type==="oral") return startOral();
  if(type==="six") startSession({title:"65/20 test",kind:"six",qs:sample(Q.filter(q=>q.s&&(!q.L||localReady(q))).map(q=>q.n),10),hearts:null,pass:6,stopWrong:5,max:10});
  else startSession({title:"Mock interview",kind:"mock",qs:sample(Q.filter(q=>!q.L||localReady(q)).map(q=>q.n),20),hearts:null,pass:12,stopWrong:9,max:20});
}

function lessonShell(inner,foot){
  let el=$("#lesson"); if(!el){el=document.createElement("div");el.id="lesson";el.className="lesson";document.body.appendChild(el);document.body.style.overflow="hidden";}
  el.innerHTML=`<div class="lesson-inner">${inner}</div>${foot||""}`;
  return el;
}
function closeLesson(){const el=$("#lesson");if(el)el.remove();document.body.style.overflow="";L=null;try{speechSynthesis.cancel()}catch(e){};document.onkeydown=null;render();}
function head(){
  const isTest=L.kind==="mock"||L.kind==="six";
  const pct = isTest ? (L.doneN/L.max*100) : (L.doneN/(L.total||1)*100);
  const right = isTest ? `<div class="hearts" style="color:var(--green-d)">${I.check.replace('<svg','<svg style="width:22px;height:22px"')}${L.right}<span style="color:var(--red);margin-left:8px">${I.x.replace('<svg','<svg style="width:20px;height:20px"')}${L.wrongN}</span></div>`
    : `<div class="hearts">${I.heart}${L.hearts}</div>`;
  return `<div class="lhead"><button class="x" id="quit" aria-label="Quit">${I.x}</button><div class="pbar"><div style="width:${Math.max(3,pct)}%"></div></div>${right}</div>
   <div class="combo">${L.combo>=3?`🔥 ${L.combo} in a row!`:""}</div>`;
}
function bindQuit(){ $("#quit").onclick=()=>modal("Wait, don’t go!","You’ll lose your progress in this "+(L.kind==="mock"||L.kind==="six"?"test":"lesson")+".",[["Keep learning","",null],["End session","ghost",closeLesson]],"sad"); }

function showItem(){
  const it=L.queue[0];
  if(!it){ return finish(); }
  const q=it.q;
  const label = it.mode==="info" ? "Know your state" : it.mode==="type" ? "Type your answer" : (q.k>1?`Pick the set where all ${q.k} are correct`:"Choose the correct answer");
  const tags=`${q.s?`<span class="star">★ 65/20</span>`:""}`;
  let body="";
  if(it.mode==="mc"){
    body=`<div class="opts">${it.opts.map((o,i)=>`<button class="opt" data-o="${i}"><span class="k">${i+1}</span><span>${esc(displayAns(o))}</span></button>`).join("")}</div>`;
  }else if(it.mode==="type"){
    body=`<textarea class="type" id="typed" placeholder="Type in English…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><div class="kbd">Press Enter to check</div>`;
  }else{
    body=`<div class="card" style="background:#F6F2FF;border-color:#E2D8FF"><h4 style="color:#5B3CC4">This answer depends on where you live</h4><p>${esc(q.a[0])}</p><p style="margin-top:8px">Look it up at <b>senate.gov</b>, <b>house.gov</b> or your state’s website, then add it under <b>Profile → My state</b> so you can practice it here.</p></div>`;
  }
  const foot=`<div class="lfoot" id="foot"><div class="inner"><div class="fb"></div><button class="btn fbbtn ${it.mode==="info"?"green":""}" id="check" ${it.mode==="info"?"":"disabled"}>${it.mode==="info"?"Got it":"Check"}</button></div></div>`;
  lessonShell(`${head()}<div class="qtype">${label} ${tags}<span style="margin-left:auto;font-size:12px">Q${q.n}</span></div>
    <div class="qbox"><div class="mascot">${eagle()}</div><div class="bubble"><button class="speak" id="say" aria-label="Read aloud">${I.vol}</button>${esc(q.q)}</div></div>${body}`,foot);
  bindQuit();
  $("#say").onclick=()=>speak(q.q);
  if(S.set.speak) speak(q.q);
  let sel=null;
  const check=$("#check");
  if(it.mode==="mc"){
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{document.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");sel=+b.dataset.o;check.disabled=false;SND.tap();});
  }else if(it.mode==="type"){
    const ta=$("#typed"); setTimeout(()=>ta.focus(),50);
    ta.oninput=()=>{check.disabled=!ta.value.trim()};
    ta.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(ta.value.trim())check.click()}};
  }
  check.onclick=()=>{
    if(it.mode==="info"){ L.queue.shift(); L.doneN++; showItem(); return; }
    let ok, given;
    if(it.mode==="mc"){ ok = it.opts[sel]===it.correct; given=it.opts[sel];
      document.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true; if(it.opts[i]===it.correct) b.classList.add("right"); else if(i===sel) b.classList.add("wrong");});
    } else { given=$("#typed").value; ok = matches(given, q.L?localAnswers(q):q.a); $("#typed").disabled=true; }
    feedback(it,ok);
  };
  document.onkeydown=e=>{
    if(!L) return;
    if(it.mode==="mc" && /^[1-4]$/.test(e.key) && !check.dataset.done){const b=document.querySelector(`.opt[data-o="${+e.key-1}"]`); b&&b.click();}
    else if(e.key==="Enter" && document.activeElement?.id!=="typed"){const c=$("#check"); if(c&&!c.disabled){e.preventDefault();c.click()}}
  };
}
function feedback(it,ok){
  const q=it.q, isTest=L.kind==="mock"||L.kind==="six";
  const foot=$("#foot"); foot.className="lfoot "+(ok?"ok":"bad");
  const praise=["Nice!","Awesome!","Correct!","Great job!","You got it!","Perfect!"];
  const shown = q.L ? localAnswers(q) : q.a.map(displayAns);
  const best = it.mode==="mc" ? displayAns(it.correct) : shown[0];
  foot.querySelector(".fb").innerHTML = `<div class="t">${ok?I.check.replace('<svg','<svg style="width:26px;height:26px"'):I.x.replace('<svg','<svg style="width:24px;height:24px"')} ${ok?praise[Math.floor(Math.random()*praise.length)]:"Correct answer:"}</div>
    ${ok?(it.mode==="type"&&shown.length?`<div class="ans">Official wording: ${esc(shown[0])}</div>`:""):`<div class="ans">${esc(best)}</div>`}
    ${shown.length>1?`<details><summary>All ${shown.length} accepted answers</summary><ul>${shown.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>`:""}`;
  const btn=$("#check"); btn.dataset.done=1; btn.textContent="Continue"; btn.disabled=false; btn.classList.remove("green","red"); btn.classList.add(ok?"green":"red");
  if(ok){SND.ok(); L.combo++; L.bestCombo=Math.max(L.bestCombo,L.combo); S.m[q.n]=(S.m[q.n]||0)+1; if(L.kind==="practice"&&S.wrong[q.n]) delete S.wrong[q.n]; if(S.m[q.n]>=3) delete S.wrong[q.n];}
  else{SND.bad(); L.combo=0; L.mistakes++; S.m[q.n]=Math.max(0,(S.m[q.n]||0)-1); S.wrong[q.n]=1; document.querySelector(".lesson-inner").classList.add("shake"); if(!isTest) L.hearts--;}
  save();
  btn.onclick=()=>{
    L.queue.shift();
    if(isTest){ L.doneN++; ok?L.right++:L.wrongN++; L.answered.push({n:q.n,ok}); }
    else{ if(ok){L.doneN++; L.right++;} else { L.missed.add(q.n); L.queue.push(buildItem(q,true)); } }
    if(!isTest && L.hearts<=0) return outOfHearts();
    if(isTest && (L.right>=L.pass || L.wrongN>=L.stopWrong)) return finish();
    showItem();
  };
}
function outOfHearts(){
  lessonShell(`<div class="center"><div style="width:150px">${eagle("sad")}</div><h2>Out of hearts</h2><p class="lead">No worries — every mistake is practice. Review the questions and try again.</p>
   <div style="width:100%;display:flex;flex-direction:column;gap:12px"><button class="btn" id="retry">Try again</button><button class="btn ghost" id="leave">Back to path</button></div></div>`);
  const cfg={title:L.title,kind:L.kind,node:L.node,sub:L.sub,qs:L.node?L.node.qs:L.qs};
  $("#retry").onclick=()=>{ if(cfg.node) startLesson(cfg.node); else startPractice(cfg.sub||"rand"); };
  $("#leave").onclick=closeLesson;
}
function finish(){
  const secs=Math.round((Date.now()-L.start)/1000), time=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,"0")}`;
  const isTest=L.kind==="mock"||L.kind==="six";
  let xp, title, lead, mood="happy", passed=true;
  if(isTest){
    passed=L.right>=L.pass;
    xp = L.right*2 + (passed?10:0);
    title = passed?"You passed! 🇺🇸":"Not quite yet";
    lead = passed?`${L.right} correct after ${L.doneN} questions — the officer would stop here. You passed!`:`${L.right} correct, ${L.wrongN} wrong. You need ${L.pass}. Keep practicing — you’ve got this.`;
    mood = passed?"happy":"sad";
    if(L.kind==="mock"){ S.best.mc=Math.max(S.best.mc||0,L.right); }
  } else {
    const acc = Math.round(L.total/(L.total+L.mistakes)*100);
    xp = 10 + (L.mistakes===0?5:0) + (L.kind==="review"?10:0);
    title = L.mistakes===0?"Flawless lesson!":L.kind==="review"?"Unit complete!":"Lesson complete!";
    lead = L.mistakes===0?"Zero mistakes. You’re on fire.":`${acc}% accuracy · best streak ${L.bestCombo}`;
    if(L.node){ S.done[L.node.id]=true; }
    S.lessons++;
  }
  addXP(xp); save(); SND[passed?"win":"bad"](); if(passed) confetti();
  const tile=(c,h,v,ic)=>`<div class="tile" style="border-color:${c}"><div class="h" style="background:${c}">${h}</div><div class="v" style="color:${c}">${ic||""}${v}</div></div>`;
  let review="";
  if(isTest){
    review=`<div style="width:100%;text-align:left;margin-top:22px"><h4 style="margin:0 0 8px">Your answers</h4>${L.answered.map(a=>{const q=QBY[a.n];return `<div class="qitem" style="border-color:${a.ok?"#BDEBC8":"#FFC9CB"}"><div class="num">#${q.n} ${a.ok?"✅":"❌"}</div><div class="q" style="font-size:15px">${esc(q.q)}</div>${a.ok?"":`<ul>${(q.L?localAnswers(q):q.a.map(displayAns)).slice(0,4).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`}</div>`}).join("")}</div>`;
  }
  lessonShell(`<div class="center"><div style="width:150px" class="pop">${eagle(mood)}</div><h2 style="color:${passed?"var(--gold-d)":"var(--red-d)"}">${title}</h2><p class="lead">${lead}</p>
    <div class="tiles">${tile("#FFC23D","Total XP","+"+xp,I.bolt.replace('<svg','<svg style="width:22px;height:22px"'))}${isTest?tile("#3DBE5C","Score",`${L.right}/${L.doneN}`):tile("#3DBE5C","Accuracy",Math.round(L.total/(L.total+L.mistakes||1)*100)+"%")}${tile("#2F6FED","Time",time)}</div>
    ${review}
    <div style="width:100%;margin-top:26px;display:flex;flex-direction:column;gap:12px;padding-bottom:24px">${isTest&&!passed?`<button class="btn" id="again">Try another test</button>`:""}<button class="btn ${isTest&&!passed?"ghost":"green"}" id="cont">Continue</button></div></div>`);
  $("#cont").onclick=closeLesson;
  const ag=$("#again"); if(ag){const k=L.kind; ag.onclick=()=>startMock(k==="six"?"six":"mc");}
}

/* ===================== ORAL MODE ===================== */
function startOral(){
  const qs=sample(Q.filter(q=>!q.L||localReady(q)).map(q=>q.n),20);
  L={kind:"mock",title:"Oral interview",queue:qs.map(n=>({q:QBY[n],mode:"oral"})),doneN:0,right:0,wrongN:0,pass:12,stopWrong:9,max:20,answered:[],start:Date.now(),combo:0,mistakes:0,total:20};
  showOral();
}
function showOral(){
  const it=L.queue[0]; if(!it) return finish();
  const q=it.q, ans=q.L?localAnswers(q):q.a.map(displayAns);
  lessonShell(`${head()}<div class="qtype">Officer asks… <span style="margin-left:auto;font-size:12px">Q${q.n}</span></div>
   <div class="qbox"><div class="mascot">${eagle()}</div><div class="bubble"><button class="speak" id="say">${I.vol}</button>${esc(q.q)}</div></div>
   <div class="card" id="reveal" style="display:none;background:#F2F7FF;border-color:#D6E4FF"><h4>Accepted answers</h4><ul style="margin:0;padding-left:20px;line-height:1.5">${ans.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div>
   <p class="note" id="hint" style="text-align:center">Say your answer out loud, then reveal.</p>`,
   `<div class="lfoot" id="foot"><div class="inner" id="oralbtns"><button class="btn" id="show">Reveal answer</button></div></div>`);
  bindQuit(); $("#say").onclick=()=>speak(q.q); speak(q.q);
  $("#show").onclick=()=>{ $("#reveal").style.display="block"; $("#hint").style.display="none";
    $("#oralbtns").innerHTML=`<button class="btn red" id="miss">I missed it</button><button class="btn green" id="got">I got it</button>`;
    const go=ok=>{ L.queue.shift(); L.doneN++; ok?L.right++:L.wrongN++; L.answered.push({n:q.n,ok});
      if(ok){SND.ok();S.m[q.n]=(S.m[q.n]||0)+1}else{SND.bad();S.wrong[q.n]=1} save();
      if(L.right>=L.pass||L.wrongN>=L.stopWrong) return finish(); showOral(); };
    $("#got").onclick=()=>go(true); $("#miss").onclick=()=>go(false); };
}

/* ===================== FLASHCARDS ===================== */
function startFlash(unit){
  let list = unit>=0 ? Q.filter(q=>q.n>=UNITS[unit].r[0]&&q.n<=UNITS[unit].r[1]) : unit===-2 ? Q.filter(q=>q.s) : Q.slice();
  list=shuffle(list); let i=0;
  L={kind:"flash"};
  const draw=()=>{
    const q=list[i], ans=q.L?(localReady(q)?localAnswers(q):[q.a[0]]):q.a.map(displayAns);
    lessonShell(`<div class="lhead"><button class="x" id="fx">${I.x}</button><div class="pbar"><div style="width:${(i+1)/list.length*100}%"></div></div><div class="hearts" style="color:var(--muted);font-size:14px">${i+1}/${list.length}</div></div>
     <div class="flash" id="fc"><div class="in"><div class="face"><small>Question ${q.n}${q.s?" · ★ 65/20":""}</small>${esc(q.q)}<div class="note" style="margin-top:16px">Tap to flip</div></div>
     <div class="face back"><small>Answer${ans.length>1?"s":""}</small><ul>${ans.map(a=>`<li>${esc(a)}</li>`).join("")}</ul></div></div></div>
     <div style="display:flex;gap:12px"><button class="btn ghost" id="prev" ${i===0?"disabled":""}>Back</button><button class="btn ghost" id="fs" style="width:70px;flex-shrink:0" aria-label="Read aloud">${I.vol.replace('<svg','<svg style="width:22px;height:22px;vertical-align:middle"')}</button><button class="btn" id="next">${i===list.length-1?"Finish":"Next"}</button></div>`);
    $("#fc").onclick=()=>{$("#fc").classList.toggle("flip");SND.tap()};
    $("#fx").onclick=closeLesson; $("#fs").onclick=()=>speak($("#fc").classList.contains("flip")?ans[0]:q.q);
    $("#prev").onclick=()=>{i--;draw()}; $("#next").onclick=()=>{if(i===list.length-1)closeLesson();else{i++;draw()}};
    document.onkeydown=e=>{if(e.key===" "){e.preventDefault();$("#fc").click()}else if(e.key==="ArrowRight")$("#next").click();else if(e.key==="ArrowLeft"&&i>0)$("#prev").click()};
  };
  draw();
}

/* ===================== CONFETTI ===================== */
function confetti(){
  const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#2F6FED","#E5484D","#FFC23D","#3DBE5C","#FFFFFF","#7B5CE0"];
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<160)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}

render();
</script>
</body>
